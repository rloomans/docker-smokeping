name: trivy

# Weekly scan of the published image to catch vulnerabilities disclosed after it
# was built. Scans of newly built images run in docker-image-publish.yml.
on:
  schedule:
    - cron: '36 21 * * 0'
  workflow_dispatch:

permissions: {}

env:
  IMAGE: ghcr.io/rloomans/smokeping-influx:latest

jobs:
  scan:
    name: Scan published image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # to pull the image from GHCR
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-published
