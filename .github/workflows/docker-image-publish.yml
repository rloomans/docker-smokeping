name: Publish Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  schedule:
    # Weekly rebuild to pick up base image and SmokePing updates
    - cron: '30 19 * * 6'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKERHUB_IMAGE: rloomans/smokeping-influx
  GHCR_IMAGE: ghcr.io/rloomans/smokeping-influx

jobs:
  # Each architecture is built on a native runner. The Dockerfile does not build
  # reliably under QEMU/Rosetta emulation (tar fails with ENOSYS on Ubuntu 26.04).
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-26.04-arm

    permissions:
      contents: read
      packages: write

    env:
      LOCAL_IMAGE: smokeping-influx:scan

    steps:
      - name: Prepare
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          # Always load the image locally for testing; other events also push it by digest
          outputs: |
            type=docker,name=${{ env.LOCAL_IMAGE }}
            ${{ github.event_name != 'pull_request' && format('type=image,"name={0},{1}",push-by-digest=true,name-canonical=true,push=true', env.DOCKERHUB_IMAGE, env.GHCR_IMAGE) || '' }}

      - name: Smoke test built image
        run: bash tests/docker-smoke.sh "$LOCAL_IMAGE"

      - name: Save image for scanning
        if: github.event_name == 'pull_request'
        run: docker save "$LOCAL_IMAGE" --output "${RUNNER_TEMP}/image.tar"

      - name: Upload image for scanning
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          retention-days: 1

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # The scan jobs run in parallel with each other and with the merge job, so scan
  # findings never delay publishing.
  trivy:
    name: Trivy ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: build

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-26.04-arm

    permissions:
      contents: read
      packages: read # to pull the built image from GHCR
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

    env:
      # Pull requests from forks and Dependabot only get a read-only token
      CAN_UPLOAD_SARIF: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}

    steps:
      - name: Prepare
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digest
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests

      - name: Pull the built image
        if: github.event_name != 'pull_request'
        run: |
          digest="$(ls "${RUNNER_TEMP}/digests")"
          docker pull "${GHCR_IMAGE}@sha256:${digest}"
          echo "IMAGE=${GHCR_IMAGE}@sha256:${digest}" >> "$GITHUB_ENV"

      - name: Download image
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}

      - name: Load the built image
        if: github.event_name == 'pull_request'
        run: |
          docker load --input "${RUNNER_TEMP}/image.tar"
          echo "IMAGE=smokeping-influx:scan" >> "$GITHUB_ENV"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results to GitHub Security tab
        if: env.CAN_UPLOAD_SARIF == 'true'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ env.PLATFORM_PAIR }}

  # The Snyk action image is only published for amd64
  snyk:
    name: Snyk linux/amd64
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read # for actions/checkout to fetch the Dockerfile
      packages: read # to pull the built image from GHCR
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

    env:
      PLATFORM_PAIR: linux-amd64
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      # Pull requests from forks and Dependabot only get a read-only token
      CAN_UPLOAD_SARIF: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}

    steps:
      - name: Checkout
        if: env.SNYK_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to the Container registry
        if: env.SNYK_TOKEN != '' && github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digest
        if: env.SNYK_TOKEN != '' && github.event_name != 'pull_request'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests

      - name: Pull the built image
        if: env.SNYK_TOKEN != '' && github.event_name != 'pull_request'
        run: |
          digest="$(ls "${RUNNER_TEMP}/digests")"
          docker pull "${GHCR_IMAGE}@sha256:${digest}"
          echo "IMAGE=${GHCR_IMAGE}@sha256:${digest}" >> "$GITHUB_ENV"

      - name: Download image
        if: env.SNYK_TOKEN != '' && github.event_name == 'pull_request'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}

      - name: Load the built image
        if: env.SNYK_TOKEN != '' && github.event_name == 'pull_request'
        run: |
          docker load --input "${RUNNER_TEMP}/image.tar"
          echo "IMAGE=smokeping-influx:scan" >> "$GITHUB_ENV"

      - name: Run Snyk container scan
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        uses: snyk/actions/docker@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          image: ${{ env.IMAGE }}
          args: --file=Dockerfile --sarif-file-output=snyk.sarif

      - name: Remove null security severities from SARIF
        if: env.SNYK_TOKEN != '' && env.CAN_UPLOAD_SARIF == 'true' && hashFiles('snyk.sarif') != ''
        run: |
          cp snyk.sarif snyk.sarif.raw
          jq 'walk(if type == "object" and (.properties | type) == "object" then .properties |= with_entries(select(.key != "security-severity" or (.value != null and .value != "null"))) else . end)' snyk.sarif > snyk.sarif.tmp
          mv snyk.sarif.tmp snyk.sarif

      - name: Upload Snyk scan results to GitHub Security tab
        id: upload-snyk-sarif
        if: env.SNYK_TOKEN != '' && env.CAN_UPLOAD_SARIF == 'true' && hashFiles('snyk.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: snyk.sarif
          category: snyk-container

      - name: Upload SARIF diagnostic artifacts on upload failure
        if: failure() && steps.upload-snyk-sarif.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-publish-${{ github.job }}-snyk-sarif-diagnostic-attempt-${{ github.run_attempt }}
          path: |
            snyk.sarif.raw
            snyk.sarif
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch manifest
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          flavor: |
            latest=auto
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=raw,value={{date 'YYYY.MM.DD' tz='Australia/Brisbane'}}-${{ github.run_number }}
            type=sha

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          for image in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            mapfile -t tag_args < <(jq -r --arg image "$image" '.tags[] | select(startswith($image + ":")) | "-t\n" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
            mapfile -t sources < <(printf '%s\n' * | sed "s|^|${image}@sha256:|")
            docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          done

      - name: Inspect images
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${VERSION}"
          docker buildx imagetools inspect "${GHCR_IMAGE}:${VERSION}"

      # - name: Docker Hub Description
      #   uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
      #   with:
      #     username: ${{ vars.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}
      #     repository: ${{ env.DOCKERHUB_IMAGE }}
